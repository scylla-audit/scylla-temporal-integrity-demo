[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scylla-temporal-integrity-demo"
version = "1.0.0"
description = "Minimal deterministic future-data leakage demonstration"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Mikhail | SCYLLA" }]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

